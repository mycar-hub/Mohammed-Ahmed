name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and Build APK
        run: |
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH"
            CD_DIR=$(dirname "$GRADLEW_PATH")
            cd "$CD_DIR"
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew wrapper not found, executing system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Ahmed-APK
          path: "**/build/outputs/apk/debug/*.apk"
