
name: Build Android APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: java -version

      - name: Locate Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            WRAPPER="./gradlew"
          else
            WRAPPER="$(find . \
              -type d \( -name .git -o -name .gradle \) -prune \
              -o -type f -name gradlew -print | head -n 1)"
          fi

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle Wrapper (gradlew) was not found."
            echo "Check that the Android project includes its Gradle Wrapper."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle Wrapper in: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT="$(find "${{ steps.gradle.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build finished without producing a debug APK."
            exit 1
          fi

          echo "APK files found: $APK_COUNT"
          find "${{ steps.gradle.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Ahmed-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
